# cargo-deny -- dependency license, advisory and source policy.
#
# Run: `cargo deny --all-features check`
#
# `--all-features` is passed on the command line and NOT set here, because in
# cargo-deny 0.20 a `[graph] all-features = true` key is accepted without
# warning and silently does nothing. A check that passes by never looking is
# worse than no check, so the flag lives in `.gitlab-ci.yml` where it runs.
#
# One thing this tool cannot see, worth writing down before it bites: a
# compositor links system C libraries -- libinput, libdrm, gbm, xkbcommon,
# libwayland -- that never appear in the cargo graph. They are all
# MIT/BSD-shaped today, but a future `-sys` crate vendoring something copyleft
# would pass this gate and still poison distribution.
#
# The `seat` feature brought the first `-sys` crates (drm-sys, gbm-sys,
# input-sys, libseat-sys, libudev-sys). Each binds a system library found by
# pkg-config and vendors none of its C sources, so the line below still tells
# the truth about what is compiled into the binary. A new `-sys` crate gets the
# same read before it lands.
#
# The `capture` feature brought pixman-sys (MIT): its build script is one
# `rustc-link-lib=pixman-1` against the system libpixman-1 (MIT), and it
# vendors no C. Read 2026-10-01.

[licenses]
# Exhaustive rather than permissive-by-pattern, and deliberately short. A new
# dependency carrying a licence nobody has looked at should FAIL the pipeline,
# not sail through because it pattern-matched something familiar. The tree is
# two crates deep right now; every future addition is a decision someone makes
# on purpose.
#
# Absent on purpose: GPL and AGPL in any form, and LGPL. This workspace is
# Apache-2.0 and is going open source; a copyleft dependency appearing in a
# compositor's graph is the kind of thing that is cheap to refuse now and
# expensive to unpick after a release.
allow = [
    "Apache-2.0",
    "MIT",
    # Added 2026-09-04, when `perspicax-atspi` brought in zbus and its
    # proc-macros.
    #
    # Reached through exactly one crate: `unicode-ident`, which is `(MIT OR
    # Apache-2.0) AND Unicode-3.0` -- the permissive half is already allowed
    # above, and the `AND` is what fails the gate. The Unicode-3.0 term covers
    # the character tables the crate embeds, not its code.
    #
    # The Unicode License v3 is permissive and not copyleft: it grants unlimited
    # use and redistribution of the data files, and asks only that the notice
    # travel with them. It carries no reciprocal obligation, so it does not
    # touch the reason GPL/LGPL/AGPL are absent from this list, and
    # `unicode-ident` is a build-time dependency of every proc-macro crate in
    # the Rust ecosystem -- refusing it would mean refusing proc macros.
    #
    # Scope, deliberately: this allows the licence, not a class of them. A
    # second crate arriving under Unicode-3.0 still gets read before it ships.
    "Unicode-3.0",
]
# Exceptions, per crate rather than per licence, added 2026-09-29 when the
# `seat` and `xwayland` features arrived. Both licences are permissive and
# carry no reciprocal obligation; they are scoped to one crate each so that a
# third crate arriving under either still fails the gate and gets read.
#
#   - encoding_rs: `(Apache-2.0 OR MIT) AND BSD-3-Clause`. Smithay's X11 window
#     manager takes it to decode legacy X11 window titles. The BSD-3-Clause
#     term covers the WHATWG index data the crate embeds.
#   - libloading: ISC. Smithay's EGL backend takes it to open libEGL at run
#     time rather than link it. ISC is MIT with the wording trimmed.
#
# Added 2026-10-01 with W3's window titles, under the same rule:
#
#   - slotmap: Zlib. fontdb keeps its font faces in one, and cosmic-text,
#     which draws titles on the seat, takes fontdb to find the system's fonts.
#     Zlib asks only that the notice stay with the source and that altered
#     versions say so; it has no reciprocal term.
#
# Added 2026-10-03 with W5's perspicax-shell, which draws its wallpaper,
# panel and menus in software, under the same rule:
#
#   - tiny-skia and tiny-skia-path: BSD-3-Clause. A port of a subset of
#     Skia, and Skia's licence with it: keep the notice, and do not use the
#     authors' names to endorse a product. The shell draws every shape with
#     it. Read 2026-10-03.
#   - arrayref: BSD-2-Clause, which is BSD-3-Clause without the endorsement
#     clause. tiny-skia takes it for fixed-size views of its pixel slices.
exceptions = [
    { crate = "encoding_rs", allow = ["BSD-3-Clause"] },
    { crate = "libloading", allow = ["ISC"] },
    { crate = "slotmap", allow = ["Zlib"] },
    { crate = "tiny-skia", allow = ["BSD-3-Clause"] },
    { crate = "tiny-skia-path", allow = ["BSD-3-Clause"] },
    { crate = "arrayref", allow = ["BSD-2-Clause"] },
]
# A crate with no licence expression at all is a licensing unknown, not a
# permissive default.
unused-allowed-license = "warn"
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
# `deny` is the default for vulnerabilities in cargo-deny 0.20; unmaintained
# crates are surfaced rather than fatal, because "unmaintained" is a judgement
# about a project's future and belongs to a human, not to a pipeline.
unmaintained = "workspace"
yanked = "deny"

[sources]
# Everything comes from crates.io. A git dependency is how an unreviewed fork
# gets into a security-sensitive tree without anyone deciding to put it there.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
