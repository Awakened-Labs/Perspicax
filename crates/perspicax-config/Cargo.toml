[package]
name = "perspicax-config"
description = "config.toml: the schema, the classic and minimal profiles, and the check that a key names something this build has. Pure; the compositor applies what it returns."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
perspicax-policy = { path = "../perspicax-policy", version = "0.1.0" }
serde.workspace = true
thiserror.workspace = true
# Parse only: nothing here writes TOML back out, so `display` (and the writer
# it pulls in) is left off.
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
