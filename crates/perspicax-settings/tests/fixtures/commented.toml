profile = "minimal"

# autostart = [
#     { spawn = ["foot"], agent = true },   # the agent may act on this one
#     ["mako"],                             # and not on this one
# ]

[keys]
"Logo+Return" = { spawn = ["foot"] }
"Logo+Shift+Return" = { spawn = ["foot"], agent = true }
"Logo+f" = { spawn = ["firefox"] }
"Logo+Shift+f" = { spawn = ["firefox"], agent = true }
"Logo+v" = { spawn = ["vivaldi"] }
"Logo+Shift+v" = { spawn = ["vivaldi"], agent = true }
"Logo+x" = { spawn = ["env", "-u", "WAYLAND_DISPLAY", "alacritty", "--title", "x11-alacritty"] }
"Logo+g" = { spawn = ["ghostty"] }
"Logo+s" = "toggle-sticky"
"Logo+p" = { spawn = ["sh", "-c", "grim ~/pictures/$(date +%Y%m%d_%H%M%S)_screenshot.png"] }
"Alt+q" = { spawn = ["run"] }
"Logo+Left"  = "snap-left"
"Logo+Right" = "snap-right"
"Logo+Up"    = "snap-up"     # maximize; on a snapped half, its top quarter
"Logo+Down"  = "snap-down"   # un-maximize; on a snapped half, its bottom quarter
"Alt+Delete" = { spawn = ["perspicax", "lock"] }
"Logo+Page_Up" = "opacity-up"       # unbound in both profiles
"Logo+Page_Down" = "opacity-down"
"Logo+End" = "opacity-reset"

[input.keyboard]
repeat-rate = 30
numlock = true

[input.pointer]

[focus]
# model = "click"

[snap]
drag = false

[mouse.desktop]
"Mouse4" = "next-workspace"    # WheelUp
"Mouse5" = "previous-workspace"

[mouse.anywhere]
"Mouse8" = { pie = "launchers" }

[resistance]
edges = 40

[decorations]
mode = "server"
title-height = 20
# border = 2
focused = "#440000"

[decorations.agent]
focused = "#c06a3c"          # "#5a2d82", titlebar, where perspicax draws one
unfocused = "#834726"        # "#3b2454"
outline = 3                  # 0 to 8 px; 0 turns the line off
outline-colour = "#c06a3c"   # "#b37feb"

[workspaces]
grid = [6, 1]
wrap = false

[opacity]
step = 10          # defaults; every value a whole percent, 1–100
floor = 20         # the lowest the keys go
unfocused = 90     # share of its own a window without the keyboard is drawn at

[opacity.apps]     # by Wayland app id or X11 WM_CLASS class, exact
foot = 90

[shell]
desktop-icons = false
leave = ["lock", "log-out", "reboot", "power-off"]
# lock = ["swaylock"]

[shell.wallpapers]
1 = "~/My Documents/My Wallpapers/Dreaming_by_DerecV2-1920x1200.png"
# 1 = "#b3d9f3"
2 = "~/pictures/wallpaper/06fa75867b875a2f7a09a2bfd7491406.jpg"
3 = "~/My Documents/My Wallpapers/gnome_Pathway_1600x1200.jpg"
4 = "~/pictures/wallpaper/The_Hive_by_spr33.jpg"
5 = "~/My Documents/My Wallpapers/shadowness_insanitydimension_1920x1200.png"
6 = "~/My Documents/My Wallpapers/shadowness_unleashed-1920x1200_expanded_left.png"

[shell.panel]
enabled = true
clock = "%H:%M:%S"
edge = "bottom"
height = 32
width = 400
align = "center"
items = ["start", "taskbar", "mixer", "tray", "clock"]
task-titles = true

[shell.mixer]
panel = ["levels"]

[shell.pie]
size = 580
icons = "~/.config/perspicax/icons"
grow = 1.75
# aliases = [
#   { app-id = "com.mitchellh.ghostty", as = "ghostty" },
#   { title = "Steam", as = "steam" }
# ]

[shell.pie.menus]
