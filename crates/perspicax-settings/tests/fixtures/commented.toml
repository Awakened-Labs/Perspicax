[theme]
name = "breeze-dark"
logo = "~/pictures/ennius_logo.png"
# logo = "~/pictures/perspicax_logo.png"
# logo = "~/pictures/atlabs_logo.png"

[theme.palette]
accent = "#e93d5a"
lock-accent = "#834726"
# lock
# font
# lock-ink
lock-ring = "#c06a3c"
# alert

# [splash]
# enabled = false   # on by default, wherever there is a seat

[protocols]

[agent]
socket = true                     # $XDG_RUNTIME_DIR/perspicax-mcp (default); or a path; or false
# launch = ["flutter", "zenity"]  # apps the agent can freely launch, "off" (the default), "any", or a list

[[output]]
name = "eDP-1"
scale = 0.9

