[shell.start-menu]
# icon = "start-here"          # a theme's name, or an image file (anything with a "/"); unset or not found: the mark
mode = "replace"               # "extend" (the default) puts the items above the applications
search = "all"                 # "menu" (the default), "all", or "none" for no search line
items = [
  { app = "com.mitchellh.ghostty" },
  { app = "Alacritty" },
  { app = "foot" },
  { label = "ennius", exec = ["ennius"] },
  { label = "Internet", items = [
