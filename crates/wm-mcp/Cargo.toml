[package]
name = "wm-mcp"
description = "The agent interface: an MCP server over stdio. Tools, DTOs, and receipts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# Deliberately short, and the two absences are the point: no `wm-compositor`
# and no `wm-atspi`. The agent-facing surface is portable for the same reason
# `wm-index` is -- a GNOME extension or a KWin plugin that satisfies
# [`Desktop`](crate::Desktop) gets this server unchanged. What this crate cannot
# see, it cannot come to depend on.
[dependencies]
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
wm-index = { path = "../wm-index", version = "0.1.0" }
wm-node = { path = "../wm-node", version = "0.1.0" }

# The protocol test speaks JSON-RPC down a `tokio::io::duplex` pair, which needs
# two features the library itself does not: `io-util` for the pipe and the split,
# and `time` for the timeout that makes a wedged server fail the test instead of
# hanging CI.
[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "time"] }
