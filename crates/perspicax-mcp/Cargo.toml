[package]
name = "perspicax-mcp"
description = "The agent interface: an MCP server over stdio. Tools, DTOs, and receipts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# Deliberately short, and the two absences are the point: no
# `perspicax-compositor` and no `perspicax-atspi`. The agent-facing surface is
# portable for the same reason `perspicax-index` is -- a GNOME extension or a
# KWin plugin that satisfies [`Desktop`](crate::Desktop) gets this server
# unchanged. What this crate cannot see, it cannot come to depend on.
[dependencies]
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
perspicax-index = { path = "../perspicax-index", version = "0.1.0" }
perspicax-node = { path = "../perspicax-node", version = "0.1.0" }
# `screenshot` answers with a PNG, base64 inside the JSON-RPC frame as MCP's
# image content requires. Both pure Rust, and both portable: a picture is a
# value here, not a renderer.
base64 = "0.23"
png = "0.18"

# The protocol test speaks JSON-RPC down a `tokio::io::duplex` pair, which needs
# two features the library itself does not: `io-util` for the pipe and the split,
# and `time` for the timeout that makes a wedged server fail the test instead of
# hanging CI.
[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "time"] }
