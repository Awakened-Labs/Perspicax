[package]
name = "perspicax-mcp"
description = "The agent interface: an MCP server over stdio or a Unix socket. Tools, DTOs, and receipts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# Deliberately short, and the two absences are the point: no
# `perspicax-compositor` and no `perspicax-atspi`. The agent-facing surface is
# portable for the same reason `perspicax-index` is -- a GNOME extension or a
# KWin plugin that satisfies [`Desktop`](crate::Desktop) gets this server
# unchanged. What this crate cannot see, it cannot come to depend on.
[dependencies]
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `net` for the Unix socket an agent inside the session connects to, and `time`
# for how often, with nobody connected, the queue of changes is let go of.
tokio = { workspace = true, features = ["net", "time"] }
tracing.workspace = true
# The socket's two questions about who is on the other end, without `unsafe`:
# our own uid, to close a connection from anyone else, and the pid answering on
# a path already taken, to say which process has it. Already `perspicax`'s.
rustix = { version = "1", default-features = false, features = ["net", "process", "std"] }
perspicax-index = { path = "../perspicax-index", version = "0.1.0" }
perspicax-node = { path = "../perspicax-node", version = "0.1.0" }
# `screenshot` answers with a PNG, base64 inside the JSON-RPC frame as MCP's
# image content requires. Both pure Rust, and both portable: a picture is a
# value here, not a renderer.
base64 = "0.23"
png = "0.18"

# The protocol test speaks JSON-RPC down a `tokio::io::duplex` pair, which needs
# a feature the library itself does not: `io-util` for the pipe and the split.
# `time` is for the timeout that makes a wedged server fail the test instead of
# hanging CI, and `net` for the socket test's clients.
[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "net", "time"] }
