[package]
name = "wm"
description = "The composition root: one binary that runs the compositor, and from M3 the MCP server beside it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# A binary, not a library, and its own crate rather than a `[[bin]]` inside
# `wm-compositor`. The composition root is where independent pieces are wired
# together, so it depends on all of them and nothing depends on it: M3 adds
# `wm-mcp` here without `wm-compositor` -- a library about surfaces -- having to
# acquire a dependency on an MCP server to keep a binary compiling.
[lints]
workspace = true

# A library and a binary from one crate. The library exists so that the demo
# this milestone is judged on can be run by a test as well as by a person --
# an integration test cannot reach inside a binary crate, and a test that
# reimplemented the demo would be testing the reimplementation.
[lib]
name = "wm"
path = "src/lib.rs"

[[bin]]
name = "wm"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
# `anyhow` for the binary and `thiserror` for the library half, which is the
# workspace's rule rather than an exception to it: `act::Failure` is matched on
# by `wm-mcp` to tell a refusal an agent can recover from apart from a
# compositor fault it cannot, so it has to be a type and not a message.
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wm-atspi = { path = "../wm-atspi", version = "0.1.0" }
wm-compositor = { path = "../wm-compositor", version = "0.1.0" }
wm-index = { path = "../wm-index", version = "0.1.0" }
wm-node = { path = "../wm-node", version = "0.1.0" }
