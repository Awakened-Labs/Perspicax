[package]
name = "perspicax-shell"
description = "The desktop for perspicax: wallpaper, panel, tray, start menu, root menu and desktop icons, each a cargo feature and a config toggle. A Wayland client of standard protocols, readable by agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# A library and a binary from one crate, as `perspicax` is. The binary is what
# the compositor starts. The library is what the compositor's live tests run
# on a thread of their own, so a test of what the shell draws needs no binary
# found on disk and no process supervised.
[lib]
name = "perspicax_shell"
path = "src/lib.rs"

[[bin]]
name = "perspicax-shell"
path = "src/main.rs"

# No smithay here, ever: the shell is a client, and depends on the compositor
# no more than waybar does. It talks to perspicax through standard protocols
# and the one channel of its own, `perspicax-protocols`.
[dependencies]
perspicax-config = { path = "../perspicax-config", version = "0.1.0" }
perspicax-protocols = { path = "../perspicax-protocols", version = "0.1.0", features = ["client"] }
# The event loop is calloop, the one smithay already brought into the tree.
smithay-client-toolkit = { workspace = true, features = ["calloop"] }
wayland-client.workspace = true
# The taskbar and the pager: the windows, as waybar's wlr/taskbar is told
# them, and the workspaces, as its ext/workspaces is.
wayland-protocols-wlr = { workspace = true, features = ["client"], optional = true }
wayland-protocols = { workspace = true, features = ["client", "staging"], optional = true }
thiserror.workspace = true
tracing.workspace = true
# What an agent reads: each surface's tree, served on the accessibility bus.
# The tokio executor rather than the default async-io, because atspi turns on
# zbus's tokio feature for the whole workspace. With it, accesskit_unix runs
# the bus on a thread and a current-thread runtime of its own, so the shell
# itself needs no runtime.
accesskit = { workspace = true, optional = true }
accesskit_unix = { version = "0.24", default-features = false, features = ["tokio"], optional = true }
# Binary-only.
clap.workspace = true
tracing-subscriber.workspace = true

# Shapes and images, drawn in software into shared-memory buffers.
# BSD-3-Clause, with arrayref (BSD-2-Clause) beneath it; see deny.toml.
# `png-format` is off: the wallpaper decodes with the png below. resvg
# turns it on under `svg`, with that same png. 0.12 because resvg draws
# with it, so the shell has one tiny-skia, and an SVG is drawn straight
# into an icon's pixels.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"], optional = true }
# Wallpapers: PNG, with the version already in the tree for screenshots, and
# JPEG, which is what most photographs are. Both pure Rust; zune-jpeg is MIT
# OR Apache-2.0 OR Zlib.
png = { version = "0.18", optional = true }
zune-jpeg = { version = "0.5", optional = true }
# Text in the menus, shaped and drawn as the compositor draws its titles.
cosmic-text = { workspace = true, optional = true }
# The menu file. Parse only, as the config crate reads the config file.
serde = { workspace = true, optional = true }
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"], optional = true }
# Icons drawn from SVG, as most icon themes ship them. Default features off:
# an icon needs no text, no system fonts and no embedded photographs, and
# each of those brings a font stack or image decoders of its own. It draws
# with the same tiny-skia as everything else.
resvg = { version = "0.48", default-features = false, optional = true }
# The panel's clock, in the local time zone. Already in the tree for the MCP
# server's schemas; `clock` adds only iana-time-zone, which is there too.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"], optional = true }

[dev-dependencies]
# A wallpaper's colour, written as the config writes it.
perspicax-policy = { path = "../perspicax-policy", version = "0.1.0" }

# Each component is a feature, so a person who wants only a wallpaper builds
# only a wallpaper, and the config refuses a key for a component left out,
# naming its feature. None is on by default; `full` is all of them.
[features]
# A picture or a colour behind the windows, on every monitor, and one of its
# own for any workspace, followed through the pager's protocol.
wallpaper = [
    "dep:tiny-skia",
    "dep:png",
    "dep:zune-jpeg",
    "dep:accesskit",
    "dep:accesskit_unix",
    "dep:wayland-protocols",
]
# A bar along an edge of each monitor: start button, taskbar, pager, clock.
# Its start button needs `menus` as well, which the config checks. The
# taskbar draws each window's icon, found as the menus find theirs.
panel = [
    "dep:tiny-skia",
    "dep:png",
    "dep:cosmic-text",
    "dep:chrono",
    "dep:accesskit",
    "dep:accesskit_unix",
    "dep:wayland-protocols-wlr",
    "dep:wayland-protocols",
]
# The start menu and the root menu, of the installed applications. A menu
# takes the keyboard, so sctk reads the keymap with xkbcommon, the library
# the compositor already links.
menus = [
    "dep:tiny-skia",
    "dep:png",
    "dep:cosmic-text",
    "dep:serde",
    "dep:toml",
    "dep:accesskit",
    "dep:accesskit_unix",
    "smithay-client-toolkit/xkbcommon",
]
# Status icons from other programs, in the panel.
tray = ["panel"]
# The desktop folder's files, as icons on the wallpaper: drawn on the
# wallpaper's own surface, and found, named and started as the menus' items
# are, so it takes both.
icons = ["wallpaper", "menus"]
# Icons drawn from SVG, as most icon themes ship them.
svg = ["dep:resvg"]
full = ["wallpaper", "panel", "menus", "tray", "icons", "svg"]
