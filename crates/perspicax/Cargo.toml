[package]
name = "perspicax"
description = "An agent-native Wayland compositor: everything on screen as a typed, addressable API, served to agents over MCP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# A binary, not a library, and its own crate rather than a `[[bin]]` inside
# `perspicax-compositor`. The composition root is where independent pieces are
# wired together, so it depends on all of them and nothing depends on it: M3
# adds `perspicax-mcp` here without `perspicax-compositor` -- a library about
# surfaces -- having to acquire a dependency on an MCP server to keep a binary
# compiling.
[lints]
workspace = true

# A library and a binary from one crate. The library exists so that the demo
# this milestone is judged on can be run by a test as well as by a person --
# an integration test cannot reach inside a binary crate, and a test that
# reimplemented the demo would be testing the reimplementation.
[lib]
name = "perspicax"
path = "src/lib.rs"

[[bin]]
name = "perspicax"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
# `anyhow` for the binary and `thiserror` for the library half, which is the
# workspace's rule rather than an exception to it: `act::Failure` is matched on
# by `perspicax-mcp` to tell a refusal an agent can recover from apart from a
# compositor fault it cannot, so it has to be a type and not a message.
thiserror.workspace = true
# `time` for the keyring's deadline, and `sync` to carry the session's facts
# from a blocking read onto the bus thread's runtime.
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# The session bus, told where this session's displays are (issue #27). zbus is
# atspi's already; its tokio executor, as atspi has it for the whole workspace.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# `kill` without `unsafe`, which this crate forbids: a session stopping the
# accessibility bus its own bus started (H3). zbus's already.
rustix = { version = "1", default-features = false, features = ["process", "std"] }
perspicax-atspi = { path = "../perspicax-atspi", version = "0.1.0" }
perspicax-compositor = { path = "../perspicax-compositor", version = "0.1.0" }
perspicax-config = { path = "../perspicax-config", version = "0.1.0" }
perspicax-index = { path = "../perspicax-index", version = "0.1.0" }
perspicax-mcp = { path = "../perspicax-mcp", version = "0.1.0" }
perspicax-node = { path = "../perspicax-node", version = "0.1.0" }

# The USE flags. Each forwards to the crate that does the work, and `desktop` is
# the set a person logging in from a TTY wants. None are default: the gates
# build the headless compositor, and a default here would make every `cargo
# test` on a machine without libinput and libseat a build failure.
[features]
seat = ["perspicax-compositor/seat"]
xwayland = ["perspicax-compositor/xwayland"]
capture = ["perspicax-compositor/capture"]
desktop = ["seat", "xwayland", "capture"]

# The v1 demo asserts on the JSON two tools actually answered, rather than on a
# projection of it made a second time in the test -- so it needs to hold a
# `serde_json::Value`. Nothing in the library does.
[dev-dependencies]
serde_json.workspace = true
# The settings portal's test waits on its signal, a stream.
futures-util.workspace = true
# `screenshot` takes its parameters in rmcp's wrapper, and the demo calls the
# tool itself rather than a projection of it.
rmcp.workspace = true
# The shell's tests open windows of their own, for its taskbar to list: an
# application as small as a Wayland one can be, written in the test.
smithay-client-toolkit.workspace = true
wayland-client.workspace = true
