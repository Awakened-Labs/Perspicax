# GitLab CI -- the four gates, in the order they run: fmt, clippy, deny, test.
#
# This is the M0 shape and it is deliberately boring. What matters is that the
# order and the names are the same ones used across our other repositories, so
# "run the gates locally before pushing" means the same thing everywhere and the
# habit carries over rather than being relearned.
#
# The `test` job carries a live accessibility bus and two real toolkit
# applications, because that is the whole point of the ingest path and mocking
# it would test our mock. See `ci/live-tests.sh` for the session it builds.
#
# `qt6-wayland` is the M2 addition that is easy to miss and silent when
# missing: without it the Qt gallery has no Wayland platform plugin, falls back
# to xcb, and connects to xvfb instead of to our compositor -- which looks
# exactly like a broken join rather than a missing package.
#
# What M2 actually costs, measured rather than predicted. The M0 version of
# this comment expected libinput, libdrm, gbm and libxkbcommon; the real answer
# is `libxkbcommon` alone, because the compositor takes Smithay with
# `default-features = false` and no renderer at all. No EGL, no GL, no GBM, no
# DRM, no GPU -- and no libwayland either, since wayland-backend's Rust server
# implementation is what `use_system_lib` would replace. The one system library
# left is libxkbcommon, which Smithay links unconditionally for keymaps.
#
# Two things the M0 version of this comment got wrong, both corrected against
# real toolkits rather than reasoned about:
#
#   - `dbus-run-session` is in `dbus-daemon` on Debian 13, not `dbus-x11`.
#   - Qt's AT-SPI bridge is NOT a `QAccessibleBridgePlugin`. Qt 6 compiles it
#     into QtGui under QT_FEATURE_accessibility and
#     QT_FEATURE_accessibility_atspi_bridge, so there is no plugin directory to
#     look for on any distribution, and its absence is diagnosed with
#     `strings libQt6Gui.so.6 | grep org.a11y`. It is present in Debian's build.

# Trixie, not bookworm: Debian 13 is where every figure in the README was
# measured and where the live tests are known to pass, and an accessibility
# stack is not the place to discover that a different distribution behaves
# differently by accident. GTK 4.18.6, Qt 6.8.2, at-spi2-core 2.56.2.
image: rust:1.93-trixie

# Without this, every push to a branch with an open MR runs the pipeline twice
# -- once for the branch, once for the merge request event. The trap is armed
# by any job carrying a `rules:` block, so the guard lives here at the top
# where the next job to grow one cannot forget it.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - check
  - test

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  # Incremental compilation is worthless when every job is a cold build, and
  # `line-tables-only` drops the bulk of the debuginfo while keeping file:line
  # in panic backtraces. Dev/test profiles only.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

default:
  interruptible: true
  # The registry only -- deliberately not `target/`. Caching a build directory
  # means archiving and restoring it every run, and it grows without bound on
  # the runner. Keyed on Cargo.lock so a dependency bump refreshes it.
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache
  before_script:
    - rustc --version && cargo --version

# Default rustfmt style, no exceptions. No dependencies to build, so no cache.
fmt:
  stage: check
  cache: []
  script:
    - rustup component add rustfmt
    - cargo fmt --all --check

# `-D warnings`: the tree is clippy-clean, so a new warning fails the pipeline
# rather than accumulating into background noise nobody reads. Deliberate
# exceptions carry an `#[allow]` at the definition with a `reason` explaining
# itself -- the M0 skeleton crates each carry one.
clippy:
  stage: check
  script:
    - rustup component add clippy
    - cargo clippy --locked --workspace --all-targets -- -D warnings

# The daily-driver build: `--features perspicax/desktop`, which is the seat
# backend (libseat, udev, DRM, GBM, EGL, GLES, libinput) and Xwayland. The jobs
# above build without it and stay lean on purpose; this one exists so the
# backend a person actually logs in to cannot rot behind a feature nobody
# compiles. Clippy and the non-live tests only -- a container has no GPU and
# no seat, so what `--seat` does on hardware is the manual checklist's job.
seat:
  stage: check
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - rustc --version && cargo --version
    - apt-get update -qq
    # Headers and pkg-config files for every C library the feature links or
    # loads. libEGL and libGLESv2 are opened at run time, but gl_generator's
    # bindings and the EGL platform probe want the development packages present.
    - >
      apt-get install -y --no-install-recommends
      libxkbcommon-dev
      libudev-dev
      libinput-dev
      libseat-dev
      libgbm-dev
      libdrm-dev
      libegl-dev
      libgles-dev
  script:
    - rustup component add clippy
    - cargo clippy --locked --workspace --all-targets --features perspicax/desktop -- -D warnings
    - cargo test --locked --workspace --features perspicax/desktop

deny:
  stage: check
  cache:
    - key:
        files:
          - Cargo.lock
      paths:
        - .cargo/registry/index
        - .cargo/registry/cache
    # Pinned, and the version appears in the key as well as the command. They
    # are two spellings of one number: bump them together, because a key left
    # behind pins the old binary and an unpinned install lets a cargo-deny
    # release change the verdict with no commit here to explain it.
    - key: cargo-deny-0.20.2
      paths:
        - .cargo/bin
        - .cargo/.crates.toml
        - .cargo/.crates2.json
  script:
    # Idempotent because of the cache paths above: a no-op exiting 0 on a warm
    # runner. This `--locked` is cargo-deny's own lockfile, not this tree's.
    - cargo install cargo-deny --version 0.20.2 --locked
    # This tree's lockfile, asserted with cargo rather than with a flag on
    # somebody else's binary -- and asserted HERE in particular, because this
    # is the job whose verdict depends on the resolved graph. A stale lock
    # would mean cargo-deny reading dependencies no commit in this repo chose.
    - cargo metadata --locked --format-version 1 > /dev/null
    # `--all-features` must be on the command line; see the note in deny.toml
    # for why setting it in the config file silently does nothing.
    - cargo deny --all-features check

# The only job that needs a desktop. Everything it installs is what the two
# toolkits and the bus need to exist; the session itself is built by the script.
test:
  stage: test
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - rustc --version && cargo --version
    - apt-get update -qq
    # `--no-install-recommends`, so anything reached only by a Recommends has
    # to be named. `xauth` is the one that bites: it is a Recommends of xvfb
    # and `xvfb-run` exits 3 with "xauth command not found" without it, which
    # a workstation never sees because a desktop install already has it.
    #
    # `xwayland` is the W1 addition: the Xwayland provenance test starts one
    # under a headless compositor. Its X client is the test itself (x11rb), so
    # no X11 application is needed beside it.
    - >
      apt-get install -y --no-install-recommends
      xvfb
      xauth
      dbus-daemon
      at-spi2-core
      gtk-4-examples
      qt6-base-examples
      qt6-wayland
      xwayland
      libxkbcommon-dev
  script:
    - xvfb-run -a dbus-run-session -- ci/live-tests.sh
