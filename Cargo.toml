# The workspace is deliberately layered rather than flat: `perspicax-index` and
# `perspicax-node` must compile without Wayland or D-Bus anywhere in their
# graph, and a workspace member that cannot see Smithay cannot accidentally
# depend on it. That property is load-bearing -- it is what makes a GNOME or
# KWin host a port rather than a rewrite -- so it is enforced by the dependency
# graph, not by a comment asking people to be careful.
[workspace]
resolver = "3"
members = [
    "crates/perspicax",
    "crates/perspicax-atspi",
    "crates/perspicax-compositor",
    "crates/perspicax-index",
    "crates/perspicax-mcp",
    "crates/perspicax-node",
    "crates/perspicax-probe",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
# The publication home. Set before the push rather than after it, because this
# string is the one piece of the manifest that is wrong in a way no test can
# catch: it points somewhere, and a reader believes it.
repository = "https://github.com/Awakened-Labs/Perspicax"

[workspace.lints.rust]
# `forbid`, not `deny`, everywhere except the one crate that genuinely cannot
# hold the line. A compositor talks to DRM, GBM and libinput through C, so
# `perspicax-compositor` downgrades this to `deny` in its own manifest with the
# reason written there. Every other crate in the tree -- including the two that
# will eventually parse text an untrusted process rendered -- stays at `forbid`.
unsafe_code = "forbid"

[workspace.dependencies]
# AccessKit is the node schema. We do not define a parallel one: GTK 4.20 already
# ships a `GtkAccessKitContext` behind `GTK_A11Y=accesskit`, so adopting these
# types means the eventual fast path is a transport swap rather than a
# translation layer we own forever.
accesskit = "0.25"

# The accessibility bus client. Pinned at the workspace level so
# `perspicax-atspi` and any future crate that speaks AT-SPI cannot drift onto
# different versions of a wire format they both have to agree about.
atspi = { version = "0.30", features = ["tokio"] }
thiserror = "2"
tracing = "0.1"
# Only for `now_or_never`: draining a signal stream must not be able to wait,
# or `drain_changes` would block on a desktop that happens to be quiet.
futures-util = { version = "0.3", default-features = false }

# The compositor. `default-features = false` is doing a great deal of work: the
# default set turns on DRM, GBM, udev, libseat, X11, winit, EGL, GL, Vulkan and
# Xwayland, and M2 needs none of them. `wayland_frontend` is the server half of
# the protocol -- and with `use_system_lib` off, `wayland-backend` uses its Rust
# implementation, so this does not link libwayland either. `desktop` is Space
# and Window, which carry z-order and add no dependencies at all.
#
# Rendering is absent on purpose rather than deferred. Occlusion needs geometry,
# z-order, regions and damage; it does not need pixels. The only backend that
# costs system libraries is `nested`, which is a cargo feature on
# perspicax-compositor rather than something CI has to build.
smithay = { version = "0.7", default-features = false, features = [
    "wayland_frontend",
    "desktop",
] }

# Binary-only. `anyhow` in binaries and `thiserror` in libraries: a caller of a
# library must be able to match on what went wrong, whereas a CLI's only
# consumer is a person reading the message.
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Log output for the one binary that has no other way to show its work. `fmt`
# only, and no ANSI: this runs in CI and under a session manager far more often
# than it runs in somebody's terminal.
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "env-filter",
] }

# The MCP server. `server` is the half of the SDK we need (there is a `client`
# half we do not), `macros` is `#[tool_router]` / `#[tool]` / `#[tool_handler]`,
# and `transport-io` is stdio -- the only transport an MCP client launched by a
# harness ever uses. No HTTP, no SSE: a server that listens on a socket is a
# different security question, and this one is spawned as a child process.
#
# The plan named 3.1.4 and resolution takes 3.2.0, which is what the lockfile
# holds and what was read: the four macros, `ServiceExt` and `transport-io` are
# unchanged from the 1.7 we use elsewhere, and 3.x adds `name` /
# `instructions` on `#[tool_handler]`, which is where this server introduces
# itself. Written as the floor rather than pinned with `=`, like every other
# dependency here; CI's `--locked` is what makes the build reproducible.
rmcp = { version = "3.2", features = ["server", "macros", "transport-io"] }
# The JSON Schema for each tool's parameters, derived. `rmcp` re-exports the
# version it was built against as `rmcp::schemars`, and the params structs
# derive through that re-export rather than this dependency, so the two cannot
# drift apart. It is named here anyway because `#[derive(JsonSchema)]` needs
# the crate resolvable at the path the macro writes.
schemars = "1"
serde = { version = "1", features = ["derive"] }

# The audience for this compositor builds it from source -- there is no binary
# distribution and, for a thing whose claim rests on measured latencies, there
# should not be one taken on trust. So the release profile is stated rather than
# defaulted: a reader who runs the README's numbers should be running the same
# build the README was measured on.
#
# `panic` is deliberately left alone. Unwinding is load-bearing here: a client
# that provokes a panic on the compositor's own thread must not take the seat,
# the index and every other client's session down with it.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
