# Which portal backends a Perspicax session uses, found by xdg-desktop-portal
# from XDG_CURRENT_DESKTOP=perspicax. A backend that is not installed is
# skipped, so this works with whichever of them a machine has.
[preferred]
# GTK's for the file chooser, printing and the rest.
default=gtk;
# Perspicax's theme first; for a key it does not say, GTK's.
org.freedesktop.impl.portal.Settings=perspicax;gtk;
# The keyring the session's login unlocked.
org.freedesktop.impl.portal.Secret=gnome-keyring;
# Screen sharing and screenshots through wlroots' protocols, which
# perspicax speaks (screencopy; see [protocols] in the README).
org.freedesktop.impl.portal.ScreenCast=wlr;
org.freedesktop.impl.portal.Screenshot=wlr;
