# Minimal sway for the attestation spike. No bar, no keybindings, no wallpaper:
# nothing here is ever looked at. The compositor exists only so that the proxy
# has a real Wayland server to forward to, which is what keeps the measurement
# compositor-independent and off perspicax's own code.
output HEADLESS-1 resolution 1280x800
default_border none
focus_follows_mouse no
